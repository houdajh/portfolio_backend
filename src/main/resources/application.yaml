spring:
  application:
    name: devBrain-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  main:
    lazy-initialization: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      qdrant:
        url: ${SPRING_AI_VECTORSTORE_QDRANT_URL}
        api-key: ${SPRING_AI_VECTORSTORE_QDRANT_API_KEY}
        collection-name: portfolio_docs
        initialize-schema: false

server:
  port: ${SERVER_PORT:8080}

app:
  rag:
    enabled: true
    admin-token: ${RAG_ADMIN_TOKEN}
    unavailable-message: "The assistant is temporarily unavailable — you can reach me through the Contact button."
  llm:
    max-answer-chars: 600
  library:
    github:
      owner: houdajh
      repo: rag-data
      branch: master
      base-path: library
      token: ${GITHUB_TOKEN}
